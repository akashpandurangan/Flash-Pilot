# Supabase CLI configuration for local development (`supabase start`).
# Hosted projects are configured in the dashboard - mirror these auth settings there
# (see docs/SETUP.md, "Authentication settings").

project_id = "flash-pilot"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:5173/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Required: invitation linking and the owner sign-up flow assume e-mails are verified.
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "2MiB"

[functions.invite-employee]
verify_jwt = true

# Called by pg_cron / pg_net, which has no user JWT. It authenticates with the CRON_SECRET header.
[functions.process-notifications]
verify_jwt = false
